version: '3.8'

services:
  digital-twin-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: digital-twin-agent:latest
    container_name: digital-twin-agent
    
    # Environment variables from .env file
    env_file:
      - .env
    
    # Alternative: specify environment variables directly
    # environment:
    #   - GEMINI_API_KEY=${GEMINI_API_KEY}
    #   - LLM_MODEL=${LLM_MODEL}
    #   - PLATFORM_BASE_URL=${PLATFORM_BASE_URL}
    #   - TENANT_ID=${TENANT_ID}
    
    # Interactive mode for CLI
    stdin_open: true
    tty: true
    
    # Restart policy
    restart: unless-stopped
    
    # Resource limits (optional - adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Network (optional - if you need to connect to other services)
    # networks:
    #   - digital-twin-network

# Optional: Define custom network
# networks:
#   digital-twin-network:
#     driver: bridge
